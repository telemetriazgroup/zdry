services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zdry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zdry}
      POSTGRES_DB: ${POSTGRES_DB:-zdry}
    volumes:
      - zdry-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zdry} -d ${POSTGRES_DB:-zdry}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zdry}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zdryminio}
    volumes:
      - zdry-minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zdry}:${POSTGRES_PASSWORD:-zdry}@db:5432/${POSTGRES_DB:-zdry}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-zdry}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zdryminio}
      MINIO_BUCKET: zdry
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion}
      SEED_PASSWORD: ${SEED_PASSWORD:-Zdry123!}
      TZ: America/Lima
      ODOO_ENABLED: ${ODOO_ENABLED:-false}
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USER: ${ODOO_USER:-}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 8

  web:
    build:
      context: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  zdry-pg:
  zdry-minio:
